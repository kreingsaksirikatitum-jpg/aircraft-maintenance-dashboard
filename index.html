<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HS-TEW / HS-TEV Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{padding:30px 6vw;background:linear-gradient(120deg,#4b1979,#8b2d8e);color:#fff}h1{margin:0}.sub{opacity:.9;margin-top:6px}main{padding:24px 6vw}.tabs{display:flex;gap:10px;margin-bottom:20px}.tabs button{border:0;padding:12px 22px;border-radius:999px;font-weight:700;cursor:pointer}.tabs .on{background:#5b237e;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.card,section{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 22px #0001}.n{font-size:32px;font-weight:800}.lab{font-size:13px;color:#667085;margin-top:4px}section{margin-top:20px}table{width:100%;border-collapse:collapse}td{padding:11px;border-bottom:1px solid #edf0f5}td:last-child{text-align:right;font-weight:700}.note{font-size:13px;color:#667085;margin-top:15px}</style></head><body><header><h1 id="title">HS-TEW Dashboard</h1><div class="sub">Aircraft Maintenance Dashboard • Source workbook: HS-TEW_TEV.xlsx</div></header><main><div class="tabs"><button id="bTEW" class="on" onclick="show('TEW')">HS-TEW</button><button id="bTEV" onclick="show('TEV')">HS-TEV</button></div><div id="cards" class="grid"></div><section><h2>Status Summary</h2><table id="tbl"></table><div class="note">Latest combined workbook contains worksheets TEW and TEV. Header row: 7.</div></section></main><script>const D={TEW:{total:698,s:{REL:652,TECO:11,'Wait LB-B TECO':15,'Wait LAE Sign':19,'Wait MECH Sign':1}},TEV:{total:1142,s:{REL:742,TECO:400}}};function show(a){let d=D[a];title.textContent='HS-'+a+' Dashboard';bTEW.className=a==='TEW'?'on':'';bTEV.className=a==='TEV'?'on':'';cards.innerHTML='<div class="card"><div class="n">'+d.total+'</div><div class="lab">TOTAL ORDERS</div></div>'+Object.entries(d.s).map(([k,v])=>'<div class="card"><div class="n">'+v+'</div><div class="lab">'+k+'</div></div>').join('');tbl.innerHTML=Object.entries(d.s).map(([k,v])=>'<tr><td>'+k+'</td><td>'+v+' ('+(v*100/d.total).toFixed(2)+'%)</td></tr>').join('')}show('TEW')</script></body></html>
