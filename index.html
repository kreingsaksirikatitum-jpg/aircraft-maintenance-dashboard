<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aircraft Maintenance Dashboard</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1400px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#4b146d,#8b2f91);color:white;padding:24px;border-radius:18px}.hero h1{margin:0 0 6px}.controls,.cards{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.controls select,.controls input{padding:12px;border:1px solid #ccd3df;border-radius:10px;background:white;min-width:180px}.controls input{flex:1}.card{background:white;padding:16px;border-radius:14px;box-shadow:0 3px 14px #0001;min-width:150px}.card b{display:block;font-size:25px;margin-top:5px}.tablebox{background:white;border-radius:14px;overflow:auto;box-shadow:0 3px 14px #0001}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}th{background:#54206e;color:white;position:sticky;top:0}.pill{padding:4px 8px;border-radius:999px;background:#eef1f6}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.foot button{padding:9px 14px;border:0;border-radius:9px}.muted{opacity:.8;font-size:13px}.err{background:#fff0f0;color:#9d1c1c;padding:14px;border-radius:10px;margin-top:15px}</style></head><body><div class="wrap"><div class="hero"><h1>Aircraft Maintenance Dashboard</h1><div>Multi-Aircraft Order Status • Data source: Aircraft_Maintenance_Data.xlsx</div><div id="updated" class="muted"></div></div><div class="controls"><select id="aircraft"></select><select id="status"><option value="">ALL STATUS</option><option>REL</option><option>TECO</option></select><input id="search" placeholder="ค้นหา Order / Revision / Description / Work Center"></div><div class="cards"><div class="card">TOTAL<b id="total">0</b></div><div class="card">REL<b id="rel">0</b></div><div class="card">TECO<b id="teco">0</b></div><div class="card">DISPLAY<b id="shown">0</b></div></div><div id="error"></div><div class="tablebox"><table><thead><tr><th>Item</th><th>Revision</th><th>Order</th><th>Oper.WorkCenter</th><th>Description</th><th>Status</th><th>Working Group</th><th>Main WorkCtr</th></tr></thead><tbody id="body"></tbody></table></div><div class="foot"><button id="prev">◀ Previous</button><span id="page"></span><button id="next">Next ▶</button></div></div><script>const FILE='Aircraft_Maintenance_Data.xlsx';let book={},page=1,per=15;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function norm(row){return{item:row['Item'],revision:row['Revision'],order:row['Order'],wc:row['Oper.WorkCenter'],desc:row['Description'],status:String(row['Syste']??'').trim(),wg:row['Working Group'],main:row['Main WorkCtr']}}function current(){return book[$('aircraft').value]||[]}function filtered(){let q=$('search').value.trim().toLowerCase(),s=$('status').value;return current().filter(r=>(!s||r.status===s)&&(!q||[r.order,r.revision,r.desc,r.wc,r.wg,r.main].some(v=>String(v??'').toLowerCase().includes(q))))}function render(){let all=current(),f=filtered();$('total').textContent=all.length;$('rel').textContent=all.filter(x=>x.status==='REL').length;$('teco').textContent=all.filter(x=>x.status==='TECO').length;$('shown').textContent=f.length;let pages=Math.max(1,Math.ceil(f.length/per));if(page>pages)page=pages;let a=(page-1)*per;$('body').innerHTML=f.slice(a,a+per).map(r=>`<tr><td>${esc(r.item)}</td><td>${esc(r.revision)}</td><td><b>${esc(r.order)}</b></td><td>${esc(r.wc)}</td><td>${esc(r.desc)}</td><td><span class="pill">${esc(r.status)}</span></td><td>${esc(r.wg)}</td><td>${esc(r.main)}</td></tr>`).join('');$('page').textContent=`Page ${page} / ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages}async function load(){try{let res=await fetch(FILE+'?v='+Date.now());if(!res.ok)throw new Error('ไม่พบ '+FILE);let ab=await res.arrayBuffer(),wb=XLSX.read(ab,{type:'array'});wb.SheetNames.forEach(n=>{let rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{range:6,defval:''});book[n]=rows.filter(r=>r['Order']||r['Description']).map(norm)});$('aircraft').innerHTML=Object.keys(book).map(n=>`<option value="${esc(n)}">HS-${esc(n)}</option>`).join('');$('updated').textContent='Loaded '+new Date().toLocaleString('th-TH');render()}catch(e){$('error').innerHTML='<div class="err">'+esc(e.message)+' — ตรวจว่าไฟล์ Aircraft_Maintenance_Data.xlsx อยู่ใน GitHub repository เดียวกับ index.html</div>'}}$('aircraft').onchange=()=>{page=1;render()};$('status').onchange=()=>{page=1;render()};$('search').oninput=()=>{page=1;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};load();</script></body></html>
