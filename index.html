<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS-TEV Aircraft Order Dashboard</title>
<style>
:root {
  --bg:#f4f7fb; --card:#ffffff; --ink:#172033; --muted:#69758b;
  --line:#dce3ee; --accent:#5d2aa6; --accent2:#0f7b8a;
  --ok:#14804a; --warn:#b7791f; --bad:#b42318;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(135deg,#f8fbff,#f4f0ff);color:var(--ink)}
.wrap{max-width:1500px;margin:auto;padding:22px}
.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:16px}
h1{margin:0;font-size:clamp(24px,3vw,38px)}
.sub{color:var(--muted);margin-top:5px}
.badge{padding:10px 14px;background:#ede7f7;border:1px solid #d7c7ef;border-radius:14px;font-weight:800;color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(42,53,77,.08)}
.kpi{padding:16px}
.kpi .label{color:var(--muted);font-size:13px}
.kpi .value{font-size:30px;font-weight:850;margin-top:4px}
.controls{padding:14px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 5px 2px}
input,select,button{width:100%;height:42px;border:1px solid #cfd8e6;border-radius:11px;background:#fff;padding:0 11px;font:inherit;color:var(--ink)}
input:focus,select:focus{outline:3px solid rgba(93,42,166,.12);border-color:var(--accent)}
button{cursor:pointer;font-weight:800;background:var(--accent);color:white;border:none;padding:0 15px}
button.secondary{background:#fff;color:var(--ink);border:1px solid #cfd8e6}
.pills{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 14px}
.pill{background:#f1f5f9;border:1px solid #dce3ee;padding:6px 10px;border-radius:999px;font-size:12px}
.table-card{margin-top:14px;overflow:hidden}
.table-wrap{overflow:auto;max-height:66vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid #e6ebf2;white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:#2d1b52;color:#fff;z-index:2;font-size:12px}
tr:nth-child(even) td{background:#fbfcfe}
tr:hover td{background:#f1ecfa}
td.desc{max-width:440px;white-space:normal;min-width:260px}
.status-teco{font-weight:800;color:var(--ok)}
.status-rel{font-weight:800;color:var(--warn)}
.footerbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:#fff}
.pager{display:flex;gap:8px;align-items:center}
.pager button{width:auto;min-width:92px}
.small{font-size:12px;color:var(--muted)}
@media(max-width:900px){
 .kpis{grid-template-columns:repeat(2,1fr)}
 .controls{grid-template-columns:1fr 1fr}
 .hero{align-items:flex-start;flex-direction:column}
}
@media(max-width:560px){
 .wrap{padding:10px} .kpis{grid-template-columns:1fr 1fr}
 .controls{grid-template-columns:1fr}
 .footerbar{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>✈️ Aircraft Order Dashboard</h1>
      <div class="sub">Interactive select & search dashboard generated from the uploaded Excel file</div>
    </div>
    <div class="badge" id="aircraftBadge">HS-TEV</div>
  </div>

  <div class="kpis">
    <div class="card kpi"><div class="label">TOTAL ORDERS</div><div class="value" id="kTotal">0</div></div>
    <div class="card kpi"><div class="label">TECO</div><div class="value" id="kTeco">0</div></div>
    <div class="card kpi"><div class="label">REL</div><div class="value" id="kRel">0</div></div>
    <div class="card kpi"><div class="label">MATCHED</div><div class="value" id="kMatched">0</div></div>
  </div>

  <div class="card controls">
    <div>
      <label>SEARCH ANY TEXT / ORDER / EV</label>
      <input id="q" placeholder="Example: 2105137863, EV055..., cargo, 11LHM/A">
    </div>
    <div>
      <label>SELECT COLUMN</label>
      <select id="filterCol"></select>
    </div>
    <div>
      <label>SELECT VALUE</label>
      <select id="filterVal"><option value="">All values</option></select>
    </div>
    <div>
      <label>STATUS</label>
      <select id="status">
        <option value="">All status</option>
        <option value="TECO">TECO</option>
        <option value="REL">REL</option>
      </select>
    </div>
    <div style="display:flex;gap:8px">
      <button id="reset" class="secondary">Reset</button>
      <button id="csv">CSV</button>
    </div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="pills" id="quickFilters"></div>
  </div>

  <div class="card table-card">
    <div class="table-wrap">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="footerbar">
      <div class="small" id="summary"></div>
      <div class="pager">
        <button class="secondary" id="prev">◀ Previous</button>
        <span id="pageInfo" class="small"></span>
        <button class="secondary" id="next">Next ▶</button>
      </div>
    </div>
  </div>
</div>

const PAGE_SIZE = 15;
let page = 1;
const headers = DB.headers;
const rows = DB.rows;

const $ = id => document.getElementById(id);
const h = s => String(s ?? '').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function idx(name){ return headers.indexOf(name); }
const statusIdx = idx('Syste');

function init(){
  $('thead').innerHTML = headers.map(x=>`<th>${h(x)}</th>`).join('');
  $('filterCol').innerHTML = '<option value="">No column filter</option>' +
      headers.map((x,i)=>`<option value="${i}">${h(x)}</option>`).join('');
  const quick = ['Order Type','Working Group','Oper.WorkCenter','MaintActivType'];
  $('quickFilters').innerHTML = quick.filter(x=>idx(x)>=0).map(x=>`<span class="pill">${h(x)}</span>`).join('');
  bind();
  refreshFilterValues();
  render();
}

function bind(){
  ['q','status','filterVal'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{page=1;render();}));
  $('filterCol').addEventListener('change',()=>{page=1;refreshFilterValues();render();});
  $('reset').addEventListener('click',()=>{
    $('q').value=''; $('filterCol').value=''; $('filterVal').innerHTML='<option value="">All values</option>';
    $('status').value=''; page=1; render();
  });
  $('prev').addEventListener('click',()=>{if(page>1){page--;render();}});
  $('next').addEventListener('click',()=>{const n=Math.ceil(filtered().length/PAGE_SIZE); if(page<n){page++;render();}});
  $('csv').addEventListener('click',downloadCSV);
}

function refreshFilterValues(){
  const c = $('filterCol').value;
  if(c===''){ $('filterVal').innerHTML='<option value="">All values</option>'; return; }
  const vals = [...new Set(rows.map(r=>String(r[+c]??'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  $('filterVal').innerHTML = '<option value="">All values</option>'+vals.map(v=>`<option value="${h(v)}">${h(v)}</option>`).join('');
}

function filtered(){
  const q = $('q').value.trim().toLowerCase();
  const c = $('filterCol').value;
  const v = $('filterVal').value;
  const st = $('status').value;
  return rows.filter(r=>{
    if(q && !r.some(x=>String(x??'').toLowerCase().includes(q))) return false;
    if(c!=='' && v && String(r[+c]??'') !== v) return false;
    if(st && statusIdx>=0 && String(r[statusIdx]??'') !== st) return false;
    return true;
  });
}

function render(){
  const f = filtered();
  const totalPages = Math.max(1,Math.ceil(f.length/PAGE_SIZE));
  if(page>totalPages) page=totalPages;
  const start=(page-1)*PAGE_SIZE, part=f.slice(start,start+PAGE_SIZE);
  $('tbody').innerHTML = part.map(r=>'<tr>'+r.map((x,i)=>{
    const cls = headers[i]==='Description' ? 'desc' : (headers[i]==='Syste' ? ('status-'+String(x).toLowerCase()) : '');
    return `<td class="${cls}">${h(x)}</td>`;
  }).join('')+'</tr>').join('');

  const teco = rows.filter(r=>statusIdx>=0 && String(r[statusIdx])==='TECO').length;
  const rel  = rows.filter(r=>statusIdx>=0 && String(r[statusIdx])==='REL').length;
  $('kTotal').textContent = rows.length.toLocaleString();
  $('kTeco').textContent = teco.toLocaleString();
  $('kRel').textContent = rel.toLocaleString();
  $('kMatched').textContent = f.length.toLocaleString();
  $('summary').textContent = `Showing ${f.length?start+1:0}–${Math.min(start+PAGE_SIZE,f.length)} of ${f.length.toLocaleString()} matched orders`;
  $('pageInfo').textContent = `Page ${page} / ${totalPages}`;
  $('prev').disabled = page<=1; $('next').disabled = page>=totalPages;
}

function downloadCSV(){
  const f=filtered();
  const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=[headers.map(esc).join(','),...f.map(r=>r.map(esc).join(','))].join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='HS-TEV_filtered_orders.csv'; a.click(); URL.revokeObjectURL(a.href);
}
init();
